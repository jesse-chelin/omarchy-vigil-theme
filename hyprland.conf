# Vigil — warm ochre border fading to deep umber
$activeBorderColor = rgba(C3A87Ccc) rgba(443B31cc) 45deg
$inactiveBorderColor = rgba(25211F66)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 4
    gaps_out = 8
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        text_color = rgb(E5DAC9)
        text_color_inactive = rgba(E5DAC960)
        col.active = rgba(C3A87C30)
        col.inactive = rgba(25211F30)
    }
}

decoration {
    rounding = 10

    inactive_opacity = 0.85
    active_opacity = 1.0
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.12

    shadow {
        enabled = true
        range = 18
        render_power = 2
        color = rgba(0B0A0B88)
        offset = 0, 4
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
        contrast = 0.9
        brightness = 0.85
        special = true
        popups = true
    }
}

animations {
    bezier = appleSpring, 0.22, 1.1, 0.36, 1.0
    bezier = appleGravity, 0.50, 0.0, 0.65, 0.02
    bezier = appleFade, 0.28, 0.0, 0.10, 1.0

    animation = windows, 1, 5, appleSpring, popin 85%
    animation = windowsOut, 1, 3, appleGravity, popin 85%
    animation = fade, 1, 4, appleFade
    animation = fadeIn, 1, 3, appleFade
    animation = fadeOut, 1, 3, appleGravity
    animation = workspaces, 1, 4, appleSpring, slide
    animation = specialWorkspace, 1, 4, appleSpring, slidevert
}

# Frosted glass blur on waybar and notifications
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.3, match:namespace notifications
